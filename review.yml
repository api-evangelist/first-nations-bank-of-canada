  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    Identity-only (built-stub) record. No first-party developer portal or
    downloadable specification exists to harvest, and no API endpoint could be
    verified, so apis[] is intentionally empty. Only verified public web
    properties (each probed HTTP 200) were recorded as common[] link
    properties. Nothing about a host, spec, or endpoint was invented.

aid: first-nations-bank-of-canada
name: First Nations Bank of Canada
review:
  question: Does First Nations Bank of Canada expose a first-party public developer API portal or downloadable API specification?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    First Nations Bank of Canada (FNBC) — a Schedule I federally regulated
    chartered bank, ~88% Indigenous owned, headquartered in Saskatoon — does
    not run a first-party developer portal and publishes no public API. On
    2026-07-23, probes of developer.fnbc.ca, api.fnbc.ca and developers.fnbc.ca
    all returned connection failure (curl code 000; DNS did not resolve). The
    public site https://www.fnbc.ca (HTTP 200) exposes only retail online
    banking (https://online.fnbc.ca, HTTP 200) and a mobile banking app
    (iOS/Android); its footer and navigation carry Careers, Legal, Privacy
    Code, News/Media Centre, Contact and Regulatory/CDIC links, but no
    Developer, API, Open Banking, or Status resource. No OpenAPI/Swagger,
    Postman collection, or API reference is downloadable anywhere on the
    domain, so no specification could be harvested.

    Open-finance posture: Canada has no operational open-banking mandate. The
    federal Consumer-Driven Banking (CDB) framework is legislated (Budget 2024
    and the Fall Economic Statement 2024, with FCAC as overseer) but not yet
    live, so third-party access is voluntary and fragmented. FNBC publishes no
    stated CDB position, no FDX participation, and — being a US 1033-agnostic
    Canadian institution — no US Section 1033 posture. Consumer account-data
    access to FNBC today is, like most Canadian institutions, effectively
    aggregator-mediated (Flinks — a Canadian, National Bank-owned aggregator —
    Plaid, MX or Salt Edge, via screen-scraping / data connectivity) rather
    than a first-party API. No first-party auth model (OAuth2/OIDC, API key,
    or mTLS) is documented because no API is exposed.
